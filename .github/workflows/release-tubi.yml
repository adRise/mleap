name: Release to Tubi CodeArtifact

run-name: Release MLeap ${{ github.event.inputs.version || github.event.release.tag_name }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 0.24.0-TUBI)'
        required: true
        default: '0.24.0-TUBI'
  release:
    types:
      - published

jobs:
  release:
    runs-on: [self-hosted, production, large]
    steps:
      - name: Dump GitHub context
        env:
          GITHUB_CONTEXT: ${{ toJson(github) }}
        run: echo "$GITHUB_CONTEXT"

      - name: Set version
        id: version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            # Extract version from tag (e.g., v0.24.0-TUBI -> 0.24.0-TUBI)
            TAG="${{ github.event.release.tag_name }}"
            VERSION="${TAG#v}"
            echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure git user
        run: |
          git config --global user.email "sbt@tubi.tv"
          git config --global user.name "sbt"

      - name: Clone and checkout
        uses: actions/checkout@v3.5.2
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4.5.0
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'sbt'

      - name: Get Sbt Global Settings
        uses: adRise/sbt-global-settings@ci

      - name: Release to CodeArtifact
        run: |
          # Use sbt release with specified version, skip tests (already run in CI)
          sbt -v "++2.13.16" "release release-version ${{ steps.version.outputs.version }} with-defaults skip-tests"
        env:
          JAVA_OPTS: -Xms4G -Xmx4G -Xss8M -XX:ReservedCodeCacheSize=256M -XX:+UseG1GC -Dfile.encoding=UTF-8
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify build status
        if: always()
        uses: slackapi/slack-github-action@v1.23.0
        with:
          channel-id: mleap-cicd
          slack-message: "MLeap ${{ steps.version.outputs.version }} release to CodeArtifact ${{ job.status }}: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        env:
          SLACK_BOT_TOKEN: ${{ secrets.BUILD_NOTIFY_SLACK_APP_TOKEN }}